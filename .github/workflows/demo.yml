name: IaC Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'infra/Dockerfile'

permissions:
  contents: read
  security-events: write

jobs:
  iac-security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov (warn-only)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions,yaml
          external_checks_dir: .checkov/compose_checks
          output_format: sarif
          output_file_path: checkov-iac.sarif
          quiet: true
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-iac.sarif
